<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --text: #f0f6fc;
      --muted: #8b949e;
      --primary: #4f7cff;
      --primary-hover: #3b6aed;
      --danger: #f85149;
      --border: rgba(255,255,255,0.1);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      width: min(420px, 92vw);
    }

    .timer-display {
      font-size: clamp(3.5rem, 12vw, 5rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
      margin-bottom: 32px;
      color: var(--text);
    }

    .timer-display.running { color: var(--primary); }

    .inputs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-group input {
      width: 72px;
      padding: 10px;
      font-size: 1.1rem;
      text-align: center;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      outline: none;
      font: inherit;
    }

    .input-group input:focus {
      border-color: var(--primary);
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-start {
      background: var(--primary);
      color: white;
    }
    .btn-start:hover { background: var(--primary-hover); }

    .btn-reset {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-reset:hover { background: rgba(255,255,255,0.12); }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="timer-card">
    <div class="timer-display" id="display">00:00</div>

    <div class="inputs" id="inputs">
      <div class="input-group">
        <label for="minutes">Min</label>
        <input type="number" id="minutes" value="0" min="0" max="999">
      </div>
      <div class="input-group">
        <label for="seconds">Sec</label>
        <input type="number" id="seconds" value="30" min="0" max="59">
      </div>
    </div>

    <div class="buttons">
      <button class="btn btn-start" id="startBtn">Start</button>
      <button class="btn btn-reset" id="resetBtn">Reset</button>
    </div>
  </div>

  <script>
    let totalSeconds = 0;
    let remaining = 0;
    let intervalId = null;
    let isRunning = false;

    const display = document.getElementById('display');
    const minutesInput = document.getElementById('minutes');
    const secondsInput = document.getElementById('seconds');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const inputs = document.getElementById('inputs');

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function updateDisplay() {
      display.textContent = formatTime(remaining);
    }

    function getInputSeconds() {
      const m = parseInt(minutesInput.value) || 0;
      const s = parseInt(secondsInput.value) || 0;
      return m * 60 + s;
    }

    function start() {
      if (isRunning) {
        pause();
        return;
      }

      if (remaining <= 0) {
        remaining = getInputSeconds();
        if (remaining <= 0) return;
      }

      isRunning = true;
      startBtn.textContent = 'Pause';
      display.classList.add('running');
      inputs.style.opacity = '0.4';
      inputs.style.pointerEvents = 'none';

      intervalId = setInterval(() => {
        remaining--;
        updateDisplay();
        if (remaining <= 0) {
          clearInterval(intervalId);
          intervalId = null;
          isRunning = false;
          startBtn.textContent = 'Start';
          display.classList.remove('running');
          inputs.style.opacity = '1';
          inputs.style.pointerEvents = 'auto';
          alert('Timer finished!');
        }
      }, 1000);
    }

    function pause() {
      clearInterval(intervalId);
      intervalId = null;
      isRunning = false;
      startBtn.textContent = 'Resume';
      display.classList.remove('running');
    }

    function reset() {
      clearInterval(intervalId);
      intervalId = null;
      isRunning = false;
      remaining = 0;
      startBtn.textContent = 'Start';
      display.classList.remove('running');
      inputs.style.opacity = '1';
      inputs.style.pointerEvents = 'auto';
      updateDisplay();
    }

    startBtn.addEventListener('click', start);
    resetBtn.addEventListener('click', reset);

    [minutesInput, secondsInput].forEach(input => {
      input.addEventListener('input', () => {
        if (!isRunning) {
          remaining = getInputSeconds();
          updateDisplay();
        }
      });
    });

    // init
    remaining = getInputSeconds();
    updateDisplay();
  </script>
</body>
</html>
